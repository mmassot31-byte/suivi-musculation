name: Déployer Élan sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration publique
        run: node scripts/check-public-config.cjs
      - name: Préparer uniquement les fichiers publics
        run: |
          mkdir -p _site/vendor
          cp -R assets _site/assets
          cp index.html pictograms.js pictogram-source.js icons.js presentation.js achievements.js identity.js exercise-sheet.js radar.js radar-ui.js app.js tracking.js muscles.js performance.js volume.js groups.js rest.js cloud-config.js cloud-service.js account-store.js social-ui.js catalogue.js programming.js programme-review.js planning.js planner-ui.js data.js style.css sw.js manifest.webmanifest icon.svg .nojekyll _site/
          cp vendor/supabase.js vendor/NOTICE.txt _site/vendor/
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
