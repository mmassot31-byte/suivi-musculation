name: Déployer Élan sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration publique
        run: node scripts/check-public-config.cjs
      - name: Préparer uniquement les fichiers publics
        run: |
          mkdir -p _site/vendor
          cp -R assets _site/assets
          cp index.html app-layout.css challenge-forms.css goals.js goals-model.js goals-legacy.js goals.css personal-library-ui.js exercise-picker.js exercise-catalogue.js exercise-library.js exercise-replacement.js load-normalization.js exercise-reference.js exercise-key.js load-conventions.js saved-session.js saved-session.css profile-presentation.js profile-layout.css volume-dashboard.css volume-dashboard.js performance-overview.js performed-exercises.js history-view.js live-workout.js live-workout.css design.css design-ui.js season-ranks.js session-editor.js personal-records.js cardio-timer.js activity.js exercise-labels.js pictograms.js pictogram-source.js icons.js navigation.js presentation.js achievements.js feedback.js identity.js exercise-sheet.js radar.js radar-ui.js app.js tracking.js muscles.js performance.js volume.js volume-list.js groups.js group-editor.js rest.js cloud-config.js cloud-service.js account-store.js social-ui.js social-presenter.js community-ui.js trophy-room.js workout-completion.js friend-feed.js public-rankings.js notifications.js social-catalogue.js catalogue.js programming.js programme-review.js planning.js planner-ui.js data.js style.css sw.js manifest.webmanifest icon.svg .nojekyll _site/
          cp vendor/supabase.js vendor/NOTICE.txt _site/vendor/
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
